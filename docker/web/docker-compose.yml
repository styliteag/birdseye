# birdseye-web — access matrix and group/policy editor. Setup: docs/web-ui.md
#
#   cp .env.example .env   # fill in WEB_NB_URL, WEB_BASE_URL, WEB_SESSION_SECRET
#   docker compose up -d
services:
  birdseye-web:
    image: styliteag/birdseye-web:${BIRDSEYE_WEB_TAG:-latest}
    # To build from this checkout instead of pulling:
    # build:
    #   context: ../..
    #   dockerfile: docker/web/Dockerfile
    container_name: birdseye-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      # NetBird management URL (the API is called as the logged-in user).
      WEB_NB_URL: ${WEB_NB_URL:?set WEB_NB_URL, e.g. https://netbird.example.com}
      # Public URL of this UI, as the browser sees it (behind your reverse proxy).
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL, e.g. https://birdseye.example.com}
      # >= 32 random characters: openssl rand -hex 32
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?set WEB_SESSION_SECRET}
      # Must be registered in NetBird's embedded IdP (docs/web-ui.md, step 1):
      #   <WEB_BASE_URL><WEB_REDIRECT_PATH>
      WEB_REDIRECT_PATH: ${WEB_REDIRECT_PATH:-/auth/callback}
      WEB_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:-netbird-dashboard}
      WEB_CACHE_TTL: ${WEB_CACHE_TTL:-30}
      WEB_SESSION_HOURS: ${WEB_SESSION_HOURS:-12}
      # Regex on group names the Anomalies page never reports, e.g. groups used
      # only as documentation notes:  ^Z[0-9]{3}\b
      WEB_ANOMALY_IGNORE: ${WEB_ANOMALY_IGNORE:-}
      # Jobs page: the birdseye container's jobs directory (docs/web-ui.md).
      # Leave empty and drop the volumes below if you do not run birdseye.
      WEB_JOBS_DIR: ${WEB_JOBS_DIR:-}
      TZ: ${TZ:-UTC}
    # volumes:
    #   # The birdseye container's /var/lib/birdseye/jobs, as a host path
    #   # (bind-mount birdseye's state dir, e.g. ./data/birdseye:/var/lib/birdseye).
    #   # Read-only — only requests/ writable. Never mount it read-write: the
    #   # registry there names the commands the birdseye container runs as root.
    #   - ./data/birdseye/jobs:/jobs:ro
    #   - ./data/birdseye/jobs/requests:/jobs/requests
    ports:
      # Localhost only; publish through your reverse proxy (TLS).
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    # Sessions live in process memory: run exactly one replica.
